
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GTA VI - WebAR</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

/* OPENING SCREEN */

#startScreen {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

#openingPoster {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#startButton {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 35px;
    background: #e9a5ce;
    color: #171117;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    z-index: 11;
}

/* CAMERA */

#camera {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* AR OVERLAY */

#overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow-y: auto;
    padding: 15px;
    padding-bottom: 90px;
    pointer-events: none;
}

/* POSTER INSIDE CAMERA */

#arPoster {
    display: block;
    width: 75%;
    max-height: 48vh;
    object-fit: contain;
    margin: 12px auto;
    border-radius: 5px;
    box-shadow: 0 0 20px rgba(233, 165, 206, 0.5);
    pointer-events: none;
}

/* INFORMATION PANELS */

.panel {
    background: rgba(25, 17, 27, 0.92);
    border: 1px solid #e9a5ce;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    text-align: center;
    pointer-events: auto;
}

.panel h2 {
    color: #f2a6ce;
    font-size: 20px;
    margin-bottom: 8px;
}

.panel h3 {
    color: #f2a6ce;
    margin-bottom: 10px;
}

.panel p {
    font-size: 13px;
    line-height: 1.5;
}

/* CHARACTER BUTTONS */

.characters {
    display: flex;
    gap: 10px;
}

.characters .panel {
    flex: 1;
}

/* BUTTONS */

button {
    background: #e9a5ce;
    color: #171117;
    border: none;
    border-radius: 7px;
    padding: 13px 18px;
    margin-top: 10px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

/* POPUP */

#info {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    max-width: 350px;
    z-index: 5;
}

/* EXIT BUTTON */

#exitButton {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 15px;
    z-index: 6;
    padding: 14px 22px;
}

/* SMALL SCREEN ADJUSTMENT */

@media (max-height: 650px) {

    #arPoster {
        max-height: 35vh;
        width: 65%;
    }

    .panel {
        padding: 10px;
        margin-bottom: 8px;
    }

}

</style>
</head>

<body>

<!-- OPENING POSTER -->

<div id="startScreen">

    <img
        src="poster.jpg"
        id="openingPoster"
        alt="GTA VI Poster"
    >

    <button id="startButton" onclick="startAR()">
        START AR
    </button>

</div>


<!-- LIVE CAMERA -->

<video id="camera" autoplay playsinline muted></video>


<!-- AR CONTENT -->

<div id="overlay">

    <!-- WELCOME -->

    <div class="panel">

        <h2>WELCOME TO LEONIDA</h2>

        <p>
            A world of crime, chaos and opportunity.
        </p>

    </div>


    <!-- POSTER OVER CAMERA -->

    <img
        src="poster.jpg"
        id="arPoster"
        alt="GTA VI AR Poster"
    >


    <!-- CHARACTER INFORMATION -->

    <div class="characters">

        <div class="panel">

            <h3>LUCIA</h3>

            <button onclick="showInfo('lucia')">
                EXPLORE
            </button>

        </div>

        <div class="panel">

            <h3>JASON</h3>

            <button onclick="showInfo('jason')">
                EXPLORE
            </button>

        </div>

    </div>


    <!-- GAME INFORMATION -->

    <div class="panel">

        <h2>GRAND THEFT AUTO VI</h2>

        <p>
            Discover the world of Leonida.
            Explore the characters and setting
            of GTA VI.
        </p>

        <button onclick="showInfo('game')">
            EXPLORE THE GAME
        </button>

    </div>

</div>


<!-- INFORMATION POPUP -->

<div id="info" class="panel">

    <h2 id="infoTitle"></h2>

    <p id="infoText"></p>

    <button onclick="closeInfo()">
        CLOSE
    </button>

</div>


<!-- EXIT AR -->

<button id="exitButton" onclick="stopAR()">
    EXIT AR
</button>


<script>

/* CAMERA ELEMENT */

const camera = document.getElementById("camera");


/* START AR */

async function startAR() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });

        camera.srcObject = stream;

        await camera.play();

        // HIDE OPENING SCREEN

        document.getElementById(
            "startScreen"
        ).style.display = "none";

        // SHOW CAMERA

        camera.style.display = "block";

        // SHOW AR CONTENT

        document.getElementById(
            "overlay"
        ).style.display = "block";

        // SHOW EXIT BUTTON

        document.getElementById(
            "exitButton"
        ).style.display = "block";

    }

    catch (error) {

        alert(
            "Camera access failed. Please allow camera permission."
        );

        console.error(error);

    }

}


/* SHOW INFORMATION */

function showInfo(type) {

    const title =
        document.getElementById("infoTitle");

    const text =
        document.getElementById("infoText");


    if (type === "lucia") {

        title.innerText = "LUCIA";

        text.innerText =
            "Lucia is one of the two protagonists in Grand Theft Auto VI. Discover her story and journey through Leonida.";

    }

    else if (type === "jason") {

        title.innerText = "JASON";

        text.innerText =
            "Jason is the other protagonist in Grand Theft Auto VI. Explore his character and his connection with Lucia.";

    }

    else {

        title.innerText = "GRAND THEFT AUTO VI";

        text.innerText =
            "Developed by Rockstar Games, GTA VI takes players to Leonida, a fictional state inspired by Florida. Discover its characters and setting.";

    }

    document.getElementById(
        "info"
    ).style.display = "block";

}


/* CLOSE INFORMATION */

function closeInfo() {

    document.getElementById(
        "info"
    ).style.display = "none";

}


/* EXIT AR */

function stopAR() {

    // STOP CAMERA

    if (camera.srcObject) {

        camera.srcObject
            .getTracks()
            .forEach(track => track.stop());

        camera.srcObject = null;

    }

    // HIDE CAMERA

    camera.style.display = "none";

    // HIDE AR CONTENT

    document.getElementById(
        "overlay"
    ).style.display = "none";

    // CLOSE POPUP

    closeInfo();

    // HIDE EXIT BUTTON

    document.getElementById(
        "exitButton"
    ).style.display = "none";

    // RETURN TO OPENING POSTER

    document.getElementById(
        "startScreen"
    ).style.display = "flex";

}

</script>

</body>
</html>
