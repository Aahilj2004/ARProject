
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GTA VI - Augmented Reality</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            overflow: hidden;
        }

        /* POSTER OPENING SCREEN */

        #startScreen {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #poster {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #111;
        }

        #startButton {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            padding: 15px 35px;
            border: 2px solid white;
            border-radius: 8px;

            background: #e9a5ce;
            color: #171117;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        /* CAMERA */

        #camera {
            display: none;
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            z-index: 1;
        }

        /* AR INTERFACE */

        #overlay {
            display: none;
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;
            overflow-y: auto;

            pointer-events: none;
        }

        .panel {
            background: rgba(25, 17, 27, 0.90);

            border: 1px solid #e9a5ce;
            border-radius: 12px;

            padding: 18px;
            margin: 15px;

            pointer-events: auto;
        }

        /* WELCOME PANEL */

        .welcome {
            text-align: center;
            margin-top: 35px;
        }

        .welcome h2 {
            color: #f2a6ce;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 14px;
            line-height: 1.5;
        }

        /* CHARACTER PANELS */

        .characters {
            display: flex;
            gap: 10px;
        }

        .characters .panel {
            flex: 1;
            text-align: center;
            margin-top: 20px;
        }

        .characters h3 {
            color: #f2a6ce;
            margin-bottom: 12px;
        }

        /* BUTTONS */

        button {
            background: #e9a5ce;
            color: #171117;

            border: none;
            border-radius: 7px;

            padding: 12px 18px;
            margin-top: 10px;

            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.96);
        }

        /* INFORMATION WINDOW */

        #info {
            display: none;

            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 85%;
            max-width: 350px;

            z-index: 5;
            text-align: center;
        }

        #info h2 {
            color: #f2a6ce;
            margin-bottom: 15px;
        }

        #info p {
            font-size: 15px;
            line-height: 1.6;
        }

        /* EXIT BUTTON */

        #exitButton {
            display: none;

            position: fixed;
            bottom: 20px;
            right: 15px;

            z-index: 6;

            background: #e9a5ce;
            color: #171117;
        }

        /* CAMERA ERROR */

        #errorMessage {
            color: #ffaaaa;
            font-size: 14px;
            margin-top: 15px;
            max-width: 300px;
        }

    </style>

</head>

<body>


    <!-- OPENING POSTER -->

    <div id="startScreen">

        <img
            src="poster.png"
            id="poster"
            alt="GTA VI Poster"
        >

        <button
            id="startButton"
            onclick="startAR()">

            START AR

        </button>

    </div>


    <!-- LIVE CAMERA -->

    <video
        id="camera"
        autoplay
        playsinline
        muted>

    </video>


    <!-- AR FLOATING PANELS -->

    <div id="overlay">


        <!-- WELCOME PANEL -->

        <div class="panel welcome">

            <h2>WELCOME TO LEONIDA</h2>

            <p>
                A world of crime, chaos
                and opportunity.
            </p>

        </div>


        <!-- CHARACTER PANELS -->

        <div class="characters">


            <div class="panel">

                <h3>LUCIA</h3>

                <button onclick="showInfo('lucia')">

                    EXPLORE

                </button>

            </div>


            <div class="panel">

                <h3>JASON</h3>

                <button onclick="showInfo('jason')">

                    EXPLORE

                </button>

            </div>


        </div>


        <!-- GAME INFORMATION PANEL -->

        <div class="panel welcome">

            <h2>GRAND THEFT AUTO VI</h2>

            <p>
                Discover the world of Leonida.
                Explore the characters and setting
                of the next Grand Theft Auto.
            </p>

            <button onclick="showInfo('game')">

                EXPLORE THE GAME

            </button>

        </div>


    </div>


    <!-- INFORMATION POPUP -->

    <div id="info" class="panel">

        <h2 id="infoTitle"></h2>

        <p id="infoText"></p>

        <button onclick="closeInfo()">

            CLOSE

        </button>

    </div>


    <!-- EXIT AR BUTTON -->

    <button
        id="exitButton"
        onclick="stopAR()">

        EXIT AR

    </button>


    <script>


        // GET CAMERA ELEMENT

        const camera = document.getElementById("camera");


        // START AR EXPERIENCE

        async function startAR() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "environment"
                        },

                        audio: false

                    });


                // START CAMERA

                camera.srcObject = stream;

                await camera.play();


                // HIDE POSTER

                document.getElementById(
                    "startScreen"
                ).style.display = "none";


                // SHOW CAMERA

                camera.style.display = "block";


                // SHOW AR PANELS

                document.getElementById(
                    "overlay"
                ).style.display = "block";


                // SHOW EXIT BUTTON

                document.getElementById(
                    "exitButton"
                ).style.display = "block";


            }

            catch (error) {

                alert(
                    "Unable to access camera. Please allow camera permission and use HTTPS."
                );

                console.error(error);

            }

        }



        // DISPLAY INFORMATION

        function showInfo(type) {

            const title =
                document.getElementById("infoTitle");

            const text =
                document.getElementById("infoText");


            if (type === "lucia") {

                title.innerText = "LUCIA";

                text.innerText =
                    "Lucia is one of the two protagonists in Grand Theft Auto VI. Discover her story and journey through Leonida.";

            }


            else if (type === "jason") {

                title.innerText = "JASON";

                text.innerText =
                    "Jason is the other protagonist in Grand Theft Auto VI. Explore his character and his connection with Lucia.";

            }


            else if (type === "game") {

                title.innerText =
                    "GRAND THEFT AUTO VI";

                text.innerText =
                    "Developed by Rockstar Games, Grand Theft Auto VI takes players to Leonida, a fictional state inspired by Florida. Discover its characters, setting and story.";

            }


            // OPEN INFORMATION WINDOW

            document.getElementById(
                "info"
            ).style.display = "block";

        }



        // CLOSE INFORMATION WINDOW

        function closeInfo() {

            document.getElementById(
                "info"
            ).style.display = "none";

        }



        // STOP AR EXPERIENCE

        function stopAR() {


            // STOP CAMERA STREAM

            if (camera.srcObject) {

                camera.srcObject
                    .getTracks()
                    .forEach(track => track.stop());

                camera.srcObject = null;

            }


            // HIDE CAMERA

            camera.style.display = "none";


            // HIDE AR PANELS

            document.getElementById(
                "overlay"
            ).style.display = "none";


            // CLOSE INFORMATION

            closeInfo();


            // HIDE EXIT BUTTON

            document.getElementById(
                "exitButton"
            ).style.display = "none";


            // RETURN TO POSTER

            document.getElementById(
                "startScreen"
            ).style.display = "flex";

        }


    </script>

</body>

</html>
